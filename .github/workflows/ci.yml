name: CI

# Every push and pull request. The release workflow (build-linux.yml) only runs
# on tags and manual dispatch, so before this existed nothing checked a commit
# until it was already being released, and the AppImage job was the first time
# the tree was ever compiled as a whole.
#
# Two jobs, deliberately in this order: the self-tests need no game files and no
# toolchain beyond g++/python3, so they finish in seconds and gate the ~10 minute
# build.

on:
  push:
    # Every branch, not just main: work lands on feature branches first, and a
    # red badge there is the point of having CI in the first place.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first run's build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-tests:
    name: Self-tests (no game files)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Structural scanner self-test
        # game/build_scan.cpp identifies modded libPVZ2.so builds by reading their
        # RegisterNatives tables. It cannot be exercised against a real mod here
        # (the game is not shipped), so the synthetic-image test must at least
        # keep compiling and passing.
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Ipvz2native/include \
            pvz2native/src/game/build_scan.cpp pvz2native/tests/build_scan_test.cpp \
            -o /tmp/build_scan_test
          /tmp/build_scan_test

      - name: Offline profiler self-test
        # tools/dump_jni_tables.py is the offline twin of build_scan.cpp: same
        # rules, applied to an APK on disk. Its fixture is a synthetic ARM32
        # shared object, so this runs without any game files.
        run: python3 tools/test_dump_jni_tables.py

  build-linux:
    name: Build (Linux x86_64, Release)
    needs: self-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        # python3-jinja2 is not optional: glad's generator is a python module in
        # this tree (glad/glad/) and the build renders its sources with jinja2.
        # Without it the configure step succeeds and the build dies at
        # "ModuleNotFoundError: No module named 'jinja2'" while generating
        # gladsources/glad/include/EGL/eglplatform.h.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev \
            python3-jinja2 \
            file zip unzip

      - name: Build
        run: |
          chmod +x compile.sh
          ./compile.sh --no-assets --jobs "$(nproc)"

      - name: Smoke test
        # --help runs before SDL_Init and before any game file is opened, so it
        # is the one path that works on a runner with no assets. It also proves
        # the binary executes rather than merely having been linked.
        run: |
          cd build/pvz2native
          file pvz2 | grep -q 'ELF 64-bit' || { echo "pvz2 is not an ELF64 binary"; exit 1; }
          ./pvz2 --help | tee /tmp/usage.txt
          for needle in '--fullscreen=1' '--fps_limit=120'; do
            grep -q -- "$needle" /tmp/usage.txt || { echo "usage text does not mention $needle"; exit 1; }
          done

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pvz2-linux-x86_64
          path: build/pvz2native/pvz2
          if-no-files-found: error

  build-windows:
    name: Build (Windows x64, Release)
    needs: self-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        # glad's generator is a python module in this tree and the build renders
        # its sources through jinja2; without it the build dies generating
        # gladsources/glad/include/EGL/eglplatform.h. MSVC, CMake and Ninja are
        # already on the runner image.
        run: python -m pip install --disable-pip-version-check jinja2

      - name: Configure
        # x64, like compile-ninja.bat and unlike compile-msvc.bat: -A Win32 puts
        # dynarmic on a 32-bit host, and it has no 32-bit x86 backend, so the
        # link fails on every Dynarmic::A32::Jit symbol.
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_BUILD_TYPE=Release `
            -DARCHITECTURE=x86_64 `
            -DBOOST_ROOT="${{ github.workspace }}/third_party/boost_1_84_0" `
            -DBoost_INCLUDE_DIR="${{ github.workspace }}/third_party/boost_1_84_0" `
            -DBoost_NO_SYSTEM_PATHS=ON

      - name: Build
        run: cmake --build build-win --config Release --parallel

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build-win/pvz2native/Release/pvz2.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $out = & ./$exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "pvz2 --help exited $LASTEXITCODE`n$out" }
          foreach ($needle in @('--fullscreen=1', '--fps_limit=120')) {
            if ($out -notlike "*$needle*") { throw "usage text does not mention $needle`n$out" }
          }

      - name: Package
        # Same layout and name the release workflow ships, so a green run here
        # means the artifact is what players would download.
        shell: pwsh
        run: |
          $name = "Plants vs. Zombies 2 - It's About Time"
          $stage = "dist-windows/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build-win/pvz2native/Release/pvz2.exe" $stage
          Copy-Item -Recurse "build-win/pvz2native/Release/assets" $stage
          Copy-Item "pvz2native/presence_rules*.txt" $stage
          Compress-Archive -Path "dist-windows/$name" -DestinationPath "PvZ2Native-Windows.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pvz2-windows-x64
          path: PvZ2Native-Windows.zip
          if-no-files-found: error
