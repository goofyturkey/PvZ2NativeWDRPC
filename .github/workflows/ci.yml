name: CI

# Every push and pull request. The release workflow (build-linux.yml) only runs
# on tags and manual dispatch, so before this existed nothing checked a commit
# until it was already being released, and the AppImage job was the first time
# the tree was ever compiled as a whole.
#
# Two jobs, deliberately in this order: the self-tests need no game files and no
# toolchain beyond g++/python3, so they finish in seconds and gate the ~10 minute
# build.

on:
  push:
    # Every branch, not just main: work lands on feature branches first, and a
    # red badge there is the point of having CI in the first place. Tags are
    # excluded on purpose -- a tag push runs the two release workflows, which do
    # the same build, and there is no reason to build everything three times.
    branches: ['**']
    tags-ignore: ['**']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first run's build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-tests:
    name: Self-tests (no game files)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Structural scanner self-test
        # game/build_scan.cpp identifies modded libPVZ2.so builds by reading their
        # RegisterNatives tables. It cannot be exercised against a real mod here
        # (the game is not shipped), so the synthetic-image test must at least
        # keep compiling and passing.
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Ipvz2native/include \
            pvz2native/src/game/build_scan.cpp pvz2native/tests/build_scan_test.cpp \
            -o /tmp/build_scan_test
          /tmp/build_scan_test

      - name: Offline profiler self-test
        # tools/dump_jni_tables.py is the offline twin of build_scan.cpp: same
        # rules, applied to an APK on disk. Its fixture is a synthetic ARM32
        # shared object, so this runs without any game files.
        run: python3 tools/test_dump_jni_tables.py

  build-linux:
    name: Build (Linux x86_64, Release)
    needs: self-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        # python3-jinja2 is not optional: glad's generator is a python module in
        # this tree (glad/glad/) and the build renders its sources with jinja2.
        # Without it the configure step succeeds and the build dies at
        # "ModuleNotFoundError: No module named 'jinja2'" while generating
        # gladsources/glad/include/EGL/eglplatform.h.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev \
            python3-jinja2 \
            file zip unzip

      - name: Build
        run: |
          chmod +x compile.sh
          ./compile.sh --no-assets --jobs "$(nproc)"

      - name: Smoke test
        # --help runs before SDL_Init and before any game file is opened, so it
        # is the one path that works on a runner with no assets. It also proves
        # the binary executes rather than merely having been linked.
        run: |
          cd build/pvz2native
          file pvz2 | grep -q 'ELF 64-bit' || { echo "pvz2 is not an ELF64 binary"; exit 1; }
          ./pvz2 --help | tee /tmp/usage.txt
          for needle in '--fullscreen=1' '--fps_limit=120'; do
            grep -q -- "$needle" /tmp/usage.txt || { echo "usage text does not mention $needle"; exit 1; }
          done

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pvz2-linux-x86_64
          path: build/pvz2native/pvz2
          if-no-files-found: error

  build-windows:
    name: Build (Windows x64, Release)
    needs: self-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # Pinned on purpose. glad is invoked as `python3 -m glad` with whichever
        # interpreter CMake resolves, and installing jinja2 into a different one
        # (the image ships several) leaves the build failing at the generator
        # with ModuleNotFoundError. The configure step passes this interpreter
        # to CMake explicitly, so there is only one candidate.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        # glad's generator is a python module in this tree and the build renders
        # its sources through jinja2; without it the build dies generating
        # gladsources/glad/include/EGL/eglplatform.h. MSVC, CMake and Ninja are
        # already on the runner image.
        run: python -m pip install --disable-pip-version-check jinja2

      - name: Set up MSVC
        # The runner image no longer answers to "Visual Studio 17 2022", so ask
        # vswhere for whatever Visual Studio is installed -- the same thing
        # compile-ninja.bat does -- and import its environment, which is what
        # puts cl.exe on PATH for the Ninja build. No generator name to keep in
        # step with the image, and no third-party action.
        #
        # Everything is wrapped so a failure lands in the run summary: this step
        # is pure environment plumbing, and "exit code 1" from it says nothing
        # about which of the four things it needs was missing.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
              "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
            )
            $vswhere = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $vswhere) { throw "vswhere.exe not found in: $($candidates -join ', ')" }

            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "vswhere found no installation with the VC.Tools.x86.x64 component" }
            Write-Host "Visual Studio: $vs"

            $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
            if (-not (Test-Path $devcmd)) { throw "missing $devcmd" }

            # Not a bare `cl`: invoking the compiler with no arguments prints its
            # banner and then exits non-zero over the missing source filename,
            # and the pwsh wrapper propagates LASTEXITCODE.
            $lines = & cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul 2>&1 && set"
            $exported = 0
            foreach ($line in $lines) {
              if ($line -match '^([^=]+)=(.*)$') {
                "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                $exported++
              }
            }
            Write-Host "exported $exported environment variables from VsDevCmd"
            if ($exported -lt 5) { throw "VsDevCmd exported only $exported variables -- the C++ tools are probably not installed" }
          } catch {
            $msg = (($_ | Out-String).Trim()) -replace "`r?`n", '%0A'
            Write-Host "::error title=MSVC setup failed::$msg"
            exit 1
          }

      - name: Configure
        # Annotated on failure: the run summary used to say only "exit code 1",
        # and CMake's own output is what names a misconfiguration.
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.', '-B', 'build-win',
            '-G', 'Ninja',
            '-DCMAKE_C_COMPILER=cl',
            '-DCMAKE_CXX_COMPILER=cl',
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DARCHITECTURE=x86_64',
            "-DBOOST_ROOT=$env:GITHUB_WORKSPACE/third_party/boost_1_84_0",
            "-DBoost_INCLUDE_DIR=$env:GITHUB_WORKSPACE/third_party/boost_1_84_0",
            "-DPython_EXECUTABLE=$env:pythonLocation/python.exe",
            "-DPython3_EXECUTABLE=$env:pythonLocation/python.exe",
            '-DBoost_NO_SYSTEM_PATHS=ON'
          )
          & cmake @cmakeArgs 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 25) -join '%0A'
            Write-Host "::error title=CMake configure failed::$tail"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          & cmake --build build-win --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # The errors, not the tail: a failed MSVC build is mostly C4996
            # warnings, and 30 trailing lines can be all warning and no cause.
            $errors = Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+|error:|LNK[0-9]+|ninja: build stopped' |
              Select-Object -Last 12 | ForEach-Object { $_.Line.Trim() }
            if (-not $errors) { $errors = Get-Content build.log -Tail 20 }
            $msg = ($errors -join '%0A') -replace '::', ':'
            Write-Host "::error title=Build failed::$msg"
            exit 1
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build-win/pvz2native/pvz2.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $out = & ./$exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "pvz2 --help exited $LASTEXITCODE`n$out" }
          foreach ($needle in @('--fullscreen=1', '--fps_limit=120')) {
            if ($out -notlike "*$needle*") { throw "usage text does not mention $needle`n$out" }
          }

      - name: Package
        # Same layout and name the release workflow ships, so a green run here
        # means the artifact is what players would download.
        shell: pwsh
        run: |
          $name = "Plants vs. Zombies 2 - It's About Time"
          $stage = "dist-windows/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build-win/pvz2native/pvz2.exe" $stage
          # The UI assets live at the repo root, and nothing copies them into the
          # build tree on Windows (compile.sh does that on Linux only), so this
          # reads the source tree the same way compile.sh does.
          if (-not (Test-Path "assets")) { throw "assets/ is missing from the source tree" }
          Copy-Item -Recurse "assets" (Join-Path $stage "assets")
          Copy-Item "pvz2native/presence_rules*.txt" $stage
          Compress-Archive -Path "dist-windows/$name" -DestinationPath "PvZ2Native-Windows.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pvz2-windows-x64
          path: PvZ2Native-Windows.zip
          if-no-files-found: error
